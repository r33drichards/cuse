[project]
name = "weechat-mcp"
version = "0.1.0"
description = "Scoped WeeChat MCP plugin and deterministic host wakeup experiment"
requires-python = ">=3.10"
dependencies = ["fastmcp==4.1.0", "mcp==2.3.0", "jsonschema>=4.26,<5"]

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
