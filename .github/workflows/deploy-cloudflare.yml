name: Validate and deploy Cloudflare on main
on:
  push:
    branches: [main]
permissions:
  contents: read
# Serialize the complete main pipeline, not just upload, so a slow older
# validation cannot overlap another deploy. Never interrupt an active deploy.
# Ordering is not guaranteed; the deploy job also checks current main below.
# GitHub may replace a pending run with a newer main push.
concurrency:
  group: cloudflare-cuse-durable-shadow-main
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/validate.yml
  worker:
    uses: ./.github/workflows/durable-webhooks.yml
  deploy:
    needs: [release, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-shadow
    defaults:
      run:
        working-directory: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check commit is still current main
        id: freshness
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not verify current main SHA; refusing deployment.'
            exit 1
          fi
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded commit; only current main may deploy.'
          fi
      - name: Require deployment credentials
        if: steps.freshness.outputs.current == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in the cloudflare-shadow GitHub environment. See cloudflare/README.md.'
            exit 1
          fi
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - if: steps.freshness.outputs.current == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .
      - if: steps.freshness.outputs.current == 'true'
        run: npm run bootstrap
        working-directory: .
      - if: steps.freshness.outputs.current == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy validated commit with locked Wrangler
        if: steps.freshness.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --keep-vars
